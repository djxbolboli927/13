# مقصد UDP برای شردهای خام (پروکسی الزام دارد؛ چون فقط مسیر gRPC را مصرف می‌کنیم
# یک پورت محلی throwaway کافی است).
proxy_dest_ip_ports = "127.0.0.1:20001"
proxy_src_bind_port = 20000
# آرگومان‌های اضافی که عیناً به پروکسی پاس داده می‌شوند (در صورت نیاز نسخه‌ی پروکسی).
proxy_extra_args = []
# منبع وضعیت زنده‌ی استخرها (فیلتر باریک فقط روی اکانت‌های همین استخرها).
pool_state_endpoint = "https://solana-yellowstone-grpc.publicnode.com:443"
pool_state_x_token = "cba491e2cd18e339c6517a51d4d497737cb04edd08d8915fc872c8a30cd5656a"
# فایل کش مشترک با متیس — ربات و متیس دقیقاً از یک لیست استخر استفاده می‌کنند.
mix_cache_path = "/root/a/metis/1/mix.json"
# کیپر whitelist‌شده‌ی ShredStream (توسط پروکسی استفاده می‌شود؛ اینجا برای مرجع).
shred_keypair = "/root/g/wallet/shred.json"
# سقف CU برای تراکنش دو-هاپ. تراکنش‌های آربیتراژ رقبا ~178k CU مصرف می‌کنند، پس
# 170k قدیمی کم بود و تراکنش می‌ترکید. 300000 با حاشیه‌ی امن.
cu_limit = 300000
network_fee_lamports = 5000
# کارمزد fallback متورا (bps). کارمزد واقعی هر استخر حالا کامل از روی زنجیره
# محاسبه می‌شود (کارمزد پایه با fee scheduler + کارمزد داینامیک نوسان، سقف 50%).
# این عدد فقط وقتی استفاده می‌شود که خواندن اکانت استخر ناممکن/نامعتبر باشد.
meteora_fee_bps = 25
# نادیده‌گرفتن تریدهای کوچک پامپ (سمت SOL کمتر از این مقدار). قبلاً 1.0 SOL بود که
# تقریباً همه‌ی تریدها را رد می‌کرد و ربات هیچ سیگنالی نمی‌دید. 0.05 = سیگنال‌های
# خیلی بیشتر (هر تریدِ ≥ ۰.۰۵ SOL بررسی می‌شود). برای شل‌تر شدن کمترش کنید.
min_trigger_sol = 0.0
# بازه‌ی جست‌وجوی مقدار ورودی بهینه.
min_amount_sol = 0.000001
max_amount_sol = 0.05
# فاصله‌ی حداقلی بین دو شلیک روی یک استخر (ms).
cooldown_ms = 400
signal_buffer = 1024
# سقف حجم به‌صورت درصدی از ذخیره‌ی WSOL استخر خرید. بهینه‌ساز خودش حجمِ بیشینه‌کننده‌ی
# سود را در این سقف پیدا می‌کند (که تعادل شکاف قیمت و لغزش است = حجم بهینه‌ی واقعی).
# 100 = تا کل ذخیره؛ برای محافظه‌کاری کمترش کنید.
max_price_impact_pct = 100.0
# ورود با این درصد کمتر از حجم بهینه (حاشیه‌ی اطمینان لغزش).
size_safety_margin_pct = 0.0
# رد فرصت‌هایی که سود پیش‌بینی‌شده‌شان از این درصدِ ورودی بیشتر است (آرتیفکت
# استخر مرده). پایین‌تر = سخت‌گیرتر.
max_profit_fraction_pct = 50.0

# ─── گرفتن ALT رایگان از جوپیتر/دیفلو/رپتور (روش ارزان و بدون هزینه) ───
# به‌جای پرداخت رنت برای ساخت ALT، از این ارائه‌دهنده‌ها که ALT بهینه برای مسیر
# چندهاپی را رایگان دارند، ALT را می‌گیریم. هر ورودی به شکل "name|baseUrl" و همه
# باید API سازگار با جوپیتر (/quote و /swap-instructions) داشته باشند. به ترتیب
# امتحان می‌شوند: اول جوپیتر (1rps)، بعد دیفلو (40rps)، بعد رپتور (بدون لیمیت).
# آدرس دقیق DFlow/Raptor را وقتی نمونه‌اش را فرستادید اضافه می‌کنیم.
alt_fetch_providers = [
  "jupiter|https://lite-api.jup.ag/swap/v1",
  # "dflow|https://...",
  # "raptor|https://...",
]
# ساخت ALT خودمان روی زنجیره (هزینه رنت دارد). طبق درخواست خاموش شد؛ فقط اگر
# ارائه‌دهنده‌ها جواب ندادند به‌عنوان fالback می‌توانید true کنید.
alt_self_build = false
# فایل ذخیره pubkey جدول(های) خودمان (فقط وقتی alt_self_build=true معنی دارد).
alt_store_path = "/root/g/our_alt.txt"

# ─── انعام جیتو (داینامیک) ───
# انعام = jito_tip_min_lamports + jito_tip_profit_fraction × سودِ تشخیص‌داده‌شده.
# کف خروجی روی‌زنجیره = ورودی + 5000 کارمزد شبکه + انعام. مثال: سود 1000 ⇒
# انعام = 1000 + 0.20×1000 = 1200 لمپرت.
jito_tip_min_lamports = 2000
jito_tip_profit_fraction = 0.20

# ─── گاردِ preempt (بازبینی لحظه‌ی آخر قبل از ارسال) ───
# false = فعال (پیش‌فرض): اگر بعد از محاسبه و قبل از ارسال، اکانتِ استخر متورا
# روی زنجیره تغییر کرده باشد (تراکنشی به آن خورده)، معامله با وضعیت تازه دوباره
# قیمت‌گذاری می‌شود و اگر دیگر سودده نبود ارسال نمی‌شود (شمارنده‌ی preempted).
# اگر استخر تغییری نکرده باشد، بدون هیچ بازبینی‌ای ارسال می‌شود — یعنی فقط
# «دیدنِ یک تراکنش واقعی روی استخر متورا» جلوی ارسال را می‌گیرد.
# true = گارد خاموش، همیشه ارسال.
disable_preempt = false

# ─── حالتِ فقط-شبیه‌سازی (بدونِ ارسال) ───
# true = ربات کلِ زنجیره‌ی «تشخیص + شبیه‌سازیِ هر تراکنش + تطبیق با gRPC» را اجرا
# می‌کند اما هیچ تراکنشی به شبکه ارسال نمی‌کند؛ execute() بعد از لاگِ فرصت برمی‌گردد.
# هدف: بررسیِ اینکه آیا شبیه‌سازیِ ما با واقعیت می‌خواند، بدونِ سیل‌کردنِ شبکه با
# ارسال‌های (اغلب سودِ توهمی). پیش‌فرض true — ارسال یک انتخابِ صریح است.
sim_only = true

# ─── تشخیصِ «محاسبه‌ی ما در برابر شبکه» (RPC simulateTransaction) ───
# بعد از هر ارسال، همان تراکنشِ دقیق را با simulateTransaction روی وضعیتِ زنده‌ی
# زنجیره اجرا می‌کند و در لاگ می‌نویسد: خروجیِ پیش‌بینی‌شده‌ی ما (predicted_out) در
# کنارِ خروجیِ واقعیِ شبکه (real_out)، اختلاف لمپرتی (delta) و درصدی (delta_pct)،
# به‌علاوه‌ی لاگ خامِ برنامه‌های Pump و Meteora تا مقدار و کارمزدِ هر لگ دستی مقایسه
# شود. هیچ گِردکردنی نیست — real_out مستقیم از موجودیِ توکن‌اکانتِ WSOL بعد از
# شبیه‌سازی خوانده می‌شود (دقیق تا صفر لمپرت). خارج از مسیرِ داغ اجرا می‌شود (تسکِ
# جدا) پس صفر تأخیر به ارسال اضافه می‌کند. خروجی هم در لاگ و هم در فایلِ
# error_log_dir با تگِ «sim-compare». برای عیب‌یابی روشن کنید، در تولید خاموش.
rpc_sim_compare = true

# ─── سیاست بستن ولت‌ها ───
# true = ربات هیچ‌وقت استخر/ATA را نمی‌بندد، فقط باز می‌کند (حتی اگر ریمو-لیکویدیتی
# شود). به‌جای بستن، هر idle_token_check_secs یک‌بار توکن‌هایی که در این بازه هیچ
# تراکنشی روی استخرشان نبوده در فایل idle_tokens_path ثبت می‌شوند.
never_close_pools = true
idle_token_check_secs = 43200
idle_tokens_path = "/root/g/idle-tokens.txt"

# ─────────────── تنظیمات فاز واقعی (production) ───────────────

# ارسال مستقیم به شبکه به‌جای جیتو.
#   true  = تراکنش مستقیم با sendTransaction به RPC می‌رود؛ بدون bundle جیتو،
#           بدون tip، بدون تأخیر و هزینه‌ی اضافه‌ی جیتو. (این همان چیزی است که
#           می‌خواستید — برای ارسال مستقیم فقط همین را true بگذارید.)
#   false = مسیر جیتو (bundle + tip داینامیک) با ریت‌لیمیت 5/s REST + 5/s gRPC.
# طبق درخواست دوباره روی مسیر جیتو با انعام داینامیک هستیم.
direct_send = false
# کارمزد اولویت (micro-lamports به‌ازای هر CU) روی ارسال مستقیم. 0 = بدون کارمزد
# اولویت. اگر خواستید تراکنش‌ها سریع‌تر توسط لیدرها انتخاب شوند، این را بالا ببرید
# (مثلاً 1000). فقط وقتی direct_send=true است اثر دارد.
direct_priority_fee_microlamports = 0

# حداقل سودِ خالصِ پیش‌بینی‌شده (لمپرت) برای این‌که اصلاً اینستراکشن از متیس گرفته و
# ارسال شود. 5000 = یک کارمزد پایه‌ی شبکه. زیر این مقدار اصلاً ارسال نمی‌کنیم.
# شرط سوددهی (محاسبه‌ی دستی، بدون دخالت متیس):
#   سودده  ⇔  (خروجی − ورودی) − min_net_profit_lamports  >  0
# کفِ خروجیِ روی‌زنجیره‌ی اینستراکشن = ورودی + 5000 (کارمزد شبکه) + انعام جیتو.
# برای این‌که تراکنشی که گیت را رد می‌کند هیچ‌وقت «به‌خاطر ساختار» revert نخورد،
# این مقدار باید حداقل 6000 باشد (5000 کارمزد شبکه + 1000 حداقل انعام جیتو) تا
# کف همیشه زیر خروجیِ پیش‌بینی‌شده بماند. 6000 = دقیقاً همان «out − in − 6000 > 0».
# انعام ۲۰٪ فقط از سودِ بالای این مقدار برداشته می‌شود و در گیت دخالت ندارد.
min_net_profit_lamports = 7000

# توکن‌هایی که ولت ATA آن‌ها همیشه وجود دارد و موقع استارت هیچ‌وقت چک/ساخته نشوند.
always_exist_mints = [
  "So11111111111111111111111111111111111111112",  # SOL / WSOL
  "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",  # USDC
  "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB",  # USDT
]

# کشف خودکار استخرهای مشترک جدید (Pump + Meteora) از طریق API.
discovery_enabled = true
# فاصله‌ی هر بار پایش کشف (ثانیه). آربیتراژ است نه اسنایپ، پس چند ثانیه اشکالی ندارد.
discovery_interval_secs = 5
# سقف تعداد توکنی که موقع استارت (bootstrap) بررسی می‌شود.
discovery_bootstrap_max = 150
# ملاک «داغ بودن»: حداقل حجم معاملات ۱ ساعت اخیر (دلار). این ملاک واقعی است، نه
# سن استخر — توکنی که در ساعت گذشته فعال بوده حتی اگر استخرش قدیمی باشد. توکن‌هایی
# که آخرین تریدشان ساعت‌ها قبل بوده (حجم ۱ساعته پایین) رد می‌شوند. 0 = خاموش.
discovery_min_h1_volume_usd = 200
# حداقل نقدینگی WSOL سمت پامپ (لمپرت) برای اضافه‌شدن یک توکن. نقدینگی بیشتر روی
# پامپ مهم است. زیر این مقدار اضافه نمی‌شود. 0.05 SOL. برای خاموش‌کردن = 0.
discovery_min_pump_wsol_lamports = 50000000
# حداقل عمق WSOL سمت متئورا (لمپرت). چون آربیتراژ با سمت کم‌عمق محدود می‌شود، اگر
# ولت WSOL متئورا خیلی خالی باشد هیچ‌وقت از کارمزد بیشتر سود نمی‌دهد — رد می‌شود.
# 0.002 SOL. برای خاموش‌کردن = 0.
discovery_min_meteora_wsol_lamports = 2000000

# ─── لیبل‌های متیس (dexes=) ───
# اگر لگ Meteora مدام «No routes found» می‌دهد، لیبل را اینجا عوض کنید (بدون
# نیاز به کامپایل مجدد). حالت‌های محتمل: "Meteora DAMM v2" یا "Meteora DAMM V2".
metis_pump_label = "Pump.fun Amm"
metis_meteora_label = "Meteora DAMM v2"

# ─── اندازه/ارسال تراکنش ───
# maxAccounts که از متیس برای هر لگ می‌خواهیم. کمتر = اکانت کمتر = تراکنش کوچکتر
# (سولانا سقف 1232 بایت خام دارد). 32 برای دو-هاپ امن است. اگر خطای «too large»
# دیدید این را کمتر کنید (مثلاً 24).
metis_max_accounts = 50
# حداکثر دفعات تلاش برای کوایت یک جفت وقتی متیس «No routes found» می‌دهد. بعد از
# این تعداد، جفت غیرفعال می‌شود تا پردازش الکی انجام نشود و دلیل در فایل خطاها
# ثبت می‌گردد. 3 = زود دست بکش. 0 = پیش‌فرض داخلی (10).
metis_load_retry_limit = 3
# رد فرصت اگر حالت استخر متئورا بیش از این تعداد اسلات کهنه باشد. قیمت‌گذاری روی
# sqrt_price کهنه‌ی متئورا علتِ اثبات‌شده‌ی ریورت‌های 0x1771 است (ریاضی و دیکود
# دقیق‌اند). 0 = خاموش. پیشنهاد: 10 تا 25. ⚠️ راه‌حل اصلی: pool_state_endpoint را
# به gRPC پولی/قابل‌اعتماد خودتان (شیفت) تغییر دهید نه publicnode رایگان.
meteora_max_stale_slots = 0
# اینستراکشن SetLoadedAccountsDataSizeLimit (ربات خودش می‌گذارد، ربطی به .env متیس
# ندارد). مقدار = سقف بایت داده‌ی اکانت‌های لودشده. باید از داده‌ی واقعی (چند MB
# شامل باینری برنامه‌ها) بیشتر باشد وگرنه MaxLoadedAccountsDataSizeExceeded می‌دهد.
# 31630833 (~31.6MB) همان مقداری است که رقیب استفاده می‌کند و امن است (پیش‌فرض
# شبکه 64MB). 0 = اصلاً اضافه نشود. ⚠️ هرگز عدد کوچک مثل 131072 نگذارید!
direct_loaded_accounts_data_limit = 31630833
# SetComputeUnitPrice: کارمزد اولویت (micro-lamport به‌ازای هر CU) روی مسیر جیتو.
# در باندل جیتو معمولاً انعام (tip) کافی است، ولی رقبا priority fee هم می‌گذارند.
# این را روشن کنید (مثلاً 1000 تا 50000) تا تست کنید آیا روی landing اثر دارد.
# 0 = اصلاً اضافه نشود (پیش‌فرض). مسیر مستقیم از direct_priority_fee استفاده می‌کند.
compute_unit_price_microlamports = 0

# useSharedAccounts: ⚠️ باید false بماند! با کوت circular ادغام‌شدهٔ ما ناسازگار
# است و باعث خطای «swap_instructions failed» می‌شود. متیس خودش ALTها را بعد از
# add-market با RPC می‌گیرد و تراکنش را فشرده می‌کند؛ به این گزینه نیازی نیست.
metis_use_shared_accounts = false

# ─── تشخیص فرصت / سرعت ───
# فقط تریدهایی را بررسی کن که سمت SOL آن‌ها حداقل این کسر از ذخیره‌ی WSOL استخر
# پامپ باشد (مثلاً 0.02 = ۲٪). دقیق‌تر از آستانه‌ی ثابت لمپرتی. 0 = خاموش.
min_trigger_reserve_frac = 0.0

# ─── تشخیص رمولیکویدیتی / بستن ولت ───
# اگر برای استخر متئورای یک توکن، این تعداد ثانیه هیچ آبدیت اکانتی نیامد (ربات
# روشن بوده) استخر و ولتش بسته می‌شود. کاهش نقدینگی ملاک بستن نیست — فقط سیگنال
# withdraw از شردز یا این idle. طبق درخواست از ۴ ساعت به ۳۰ دقیقه کاهش یافت.
pool_idle_close_secs = 1800

# ─── ارسال / وضعیت تراکنش‌ها ───
# حداقل فاصله (میلی‌ثانیه) بین دو ارسال روی «یک» استخر. یک شکاف قیمتِ ثابت هر
# ~۱۰۰ms دوباره فایر می‌شود؛ بدون این عدد ده‌ها تراکنش یکسان قبل از لند اولی
# ارسال می‌شد. کوچک نگهش دارید (۱۰۰–۲۰۰) تا چند فرصت مجزا در یک بلاک هرکدام
# ارسال شوند. 0 = کاملاً خاموش (هر فرصت سودده ارسال می‌شود، فقط با سقف نرخ RPC).
send_dedup_ms = 400
# ساخت اینستراکشن از رم (کش کل مسیر): true = فرصت‌های تکراری روی یک مسیر بدون
# تماس با متیس، فقط با پچ مقدار ورودی/کف خروجی ارسال می‌شوند. false = همیشه از متیس.
"Instructions++" = true

# کارمزد بدترین‌حالتِ متورا: کارمزد داینامیک (نوسان) را به‌جای مقدار ذخیره‌شده،
# روی سقفِ max_volatility_accumulator حساب می‌کند تا هیچ‌وقت کمتر از واقعیت
# تخمین زده نشود (جلوی سود فانتوم را می‌گیرد). اگر با حالت عادی هنوز سودِ نادرست
# می‌بینید این را true کنید. پیش‌فرض false.
meteora_fee_worst_case = false

# حداقل نقدینگی WSOL (لمپرت) که هر استخر باید در «هر دو طرف» داشته باشد تا ترید
# شود. اگر ذخیره‌ی WSOL سمت پامپ یا سمت متورا زیر این مقدار باشد، فرصت همان اول
# (قبل از محاسبه‌ی لغزش) رد می‌شود تا ربات وقتش را هدر ندهد. اگر نقدینگی دوباره
# بالای این مقدار برگردد، ترید از سر گرفته می‌شود. پیش‌فرض 800000 = 0.0008 WSOL.
min_pool_wsol_lamports = 800000

# هر چند ثانیه یک‌بار برای هر جفت، ریز کارمزدِ دیکودشده‌ی متورا (پایه + داینامیک،
# حالت فعلی و بدترین‌حالت) و کارمزد پامپ‌فان در لاگ چاپ شود تا دستی با یک سواپ
# واقعی روی همان استخر مقایسه کنید. 0 = خاموش. پیش‌فرض 120.
fee_audit_log_secs = 0
# چند ثانیه بعد از ارسال مستقیم، وضعیت روی‌زنجیره‌ی تراکنش را چک کنیم
# (getSignatureStatuses با جست‌وجوی تاریخچه + چند بار retry). هر تراکنش ارسال‌شده
# حتماً یکی از حالت‌های ok/reverted/dropped/unknown را می‌گیرد.
status_check_delay_secs = 1
# مسیر فایل لاگِ فقط-خطا. فقط خطاها، «چرا تراکنش ارسال نشد» و «چرا تراکنش گم شد»
# در <dir>/shred-arb-errors.log نوشته می‌شوند.
error_log_dir = "/root/g"

# ─── ماینینگ استخر از تراکنش‌های ولت رقبا ───
# به‌جای گرفتن استخرهای داغ از API (که اکثراً از رده خارج بودند)، تراکنش‌های اخیر
# این ولت‌ها را می‌کاویم و استخرهای مشترک Pump/Meteora آن‌ها را هم به ربات و هم به
# متیس اضافه می‌کنیم. خالی = خاموش. می‌توانید چند ولت بگذارید.
target_wallets = [
  "7DxeUQ1TQ2wnYKc3vxPsvr6c93vGUBJSuRdP9R6WueGL",
  "iGhZqmSdMBR8k4Ua3ViwsdXENAd8MTGqZKX9ARVbRkg",
  "HuTshmtwcQkWBLzgW3m4uwcmik7Lmz4YFpYcTqMJpXiP",
]
# پاس اول کامل است (آخرین ~۱۰۰۰ تراکنش هر ولت). هر پاس بعدی «افزایشی» است و فقط
# تراکنش‌های جدیدتر از آخرین دیده‌شده را می‌گیرد، پس سربک بسیار کم است و می‌توان
# هر ۵ دقیقه اجرا کرد تا استخرها همیشه تازه بمانند.
wallet_mine_interval_secs = 300
wallet_mine_tx_limit = 1000
