network_fee_lamports = 5000
# کارمزد مؤثر متورا (bps). کارمزد داینامیک هنوز مدل نشده — با کوت زنده راستی‌آزمایی شود.
meteora_fee_bps = 25
# نادیده‌گرفتن تریدهای کوچک پامپ (سمت SOL کمتر از این مقدار).
min_trigger_sol = 1.0
# بازه‌ی جست‌وجوی مقدار ورودی بهینه.
